<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Threat Dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#e8edf5;font-family:Inter,system-ui,sans-serif}.top{padding:24px 5%;border-bottom:1px solid #202b3d;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0}.live{color:#55d6a2;font-size:13px}.wrap{padding:30px 5%}.stats{display:flex;gap:16px;flex-wrap:wrap}.stat{background:#101622;border:1px solid #202b3d;border-radius:14px;padding:20px;min-width:180px}.num{font-size:28px;font-weight:800}.label{color:#8995a8;font-size:13px;margin-top:5px}.table{margin-top:25px;background:#101622;border:1px solid #202b3d;border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:15px;text-align:left;border-bottom:1px solid #202b3d;font-size:13px}th{color:#8995a8}td{white-space:nowrap}.sev{color:#ff6b6b;font-weight:700}</style></head><body><header class="top"><h1>Threat System</h1><span class="live">● LIVE</span></header><main class="wrap"><div class="stats"><div class="stat"><div class="num" id="count">—</div><div class="label">Threat Indicators</div></div><div class="stat"><div class="num">URLhaus</div><div class="label">Intelligence Source</div></div><div class="stat"><div class="num">ONLINE</div><div class="label">API Status</div></div></div><div class="table"><table><thead><tr><th>Indicator</th><th>Type</th><th>Threat</th><th>Severity</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading intelligence...</td></tr></tbody></table></div></main><script>fetch('/threat-intelligence').then(r=>r.json()).then(d=>{document.getElementById('count').textContent=d.length;document.getElementById('rows').innerHTML=d.map(x=>`<tr><td>${x.indicator}</td><td>${x.indicator_type}</td><td>${x.threat_type}</td><td class="sev">${x.severity}</td><td>${x.description||'—'}</td></tr>`).join('')}).catch(()=>document.getElementById('rows').innerHTML='<tr><td colspan="5">Unable to load intelligence</td></tr>')</script></body></html>
